<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#24273a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="tasq">
<title>tasq</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app" class="app">
  <header class="top">
    <button class="title-btn" id="title" type="button" aria-label="Month"><span class="sq"></span><span id="title-text">tasq</span></button>
    <div class="top-actions">
      <button class="nav-btn" id="prev" type="button" aria-label="Previous">‹</button>
      <button class="pill-btn" id="today" type="button">Today</button>
      <button class="nav-btn" id="next" type="button" aria-label="Next">›</button>
      <div class="views" id="views" role="tablist"></div>
      <button class="icon-btn" id="refresh" type="button" aria-label="Refresh" title="Refresh">⟳</button>
      <button class="icon-btn" id="help" type="button" aria-label="Keyboard shortcuts" title="Keyboard shortcuts">?</button>
      <button class="icon-btn" id="menu" type="button" aria-label="Settings" title="Settings">⚙</button>
    </div>
  </header>
  <nav class="strip" id="strip" aria-label="Week"></nav>
  <div class="body">
    <main class="main" id="main" tabindex="-1"></main>
    <aside class="side" id="side" aria-label="Details"></aside>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</div>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="grip"></div>
  <button class="sheet-close" id="sheet-close" type="button" aria-label="Close">✕</button>
  <div class="sheet-body" id="sheet-body"></div>
</section>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/app.js" defer></script>
</body>
</html>

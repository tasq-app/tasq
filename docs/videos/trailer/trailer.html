<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:JBM;src:url(file:///root/.local/share/fonts/JetBrainsMono-Regular.ttf)}
@font-face{font-family:JBM;font-weight:bold;src:url(file:///root/.local/share/fonts/JetBrainsMono-Bold.ttf)}
html,body{margin:0;overflow:hidden;background:#181926;font-family:JBM,monospace}
#bg{position:absolute;inset:0;background:
  radial-gradient(1200px 700px at 20% 0%, #c6a0f633, transparent 60%),
  radial-gradient(1000px 700px at 100% 100%, #8aadf42b, transparent 60%),
  #181926}
#win{position:absolute;border-radius:16px;background:#24273a;box-shadow:0 40px 120px #000a,0 0 0 1px #ffffff14;overflow:hidden}
#bar{height:36px;background:#1e2030;display:flex;align-items:center;gap:9px;padding-left:16px;position:relative;z-index:3}
#bar i{width:12px;height:12px;border-radius:50%;display:block}
#bar span{position:absolute;left:0;right:0;text-align:center;color:#6e738d;font-size:14px}
#view{position:absolute;top:36px;left:0;overflow:hidden}
#cam{position:absolute;left:0;top:0;width:1200px;height:748px;transform-origin:0 0}
#cam img{position:absolute;left:0;top:0;width:1200px;height:748px;opacity:0}
#capbox{position:absolute;text-align:center;z-index:5}
#cap{color:#cad3f5;font-weight:bold;letter-spacing:-1px}
#cap b{color:#c6a0f6}
#sub{color:#8087a2;margin-top:8px}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;text-align:center;z-index:6}
.logo{font-weight:bold;color:#cad3f5;display:flex;align-items:center;gap:.2em}
.logo .sq{width:.56em;height:.56em;background:#c6a0f6;border-radius:.08em;display:inline-block}
.cursor{display:inline-block;width:.37em;height:.8em;background:#c6a0f6;margin-left:.05em}
.tag{color:#a5adcb;margin-top:26px}
.pill{margin-top:56px;color:#cad3f5;background:#1e2030;border:1px solid #ffffff1f;border-radius:16px;padding:22px 40px;box-shadow:0 20px 60px #0008}
.pill em{color:#a6da95;font-style:normal}
.small{margin-top:30px;color:#6e738d}
/* Landscape: a big window, captions as a lower third over it. */
body.h{width:1920px;height:1080px}
body.h #win{left:160px;top:22px;width:1600px;height:1033px}
body.h #view{width:1600px;height:997px}
body.h #capbox{left:50%;bottom:70px;transform:translateX(-50%);background:#181926e0;border:1px solid #ffffff1a;border-radius:18px;padding:20px 40px 22px;box-shadow:0 20px 60px #000a;white-space:nowrap}
body.h #cap{font-size:50px}
body.h #sub{font-size:23px}
body.h .logo{font-size:150px} body.h .tag{font-size:38px} body.h .pill{font-size:40px} body.h .small{font-size:26px}
/* Portrait (phones): the caption on top, a tall window close on the action. */
body.v{width:1080px;height:1350px}
body.v #win{left:40px;top:250px;width:1000px;height:1070px}
body.v #view{width:1000px;height:1034px}
body.v #capbox{left:40px;right:40px;top:58px}
body.v #cap{font-size:56px;line-height:1.15}
body.v #sub{font-size:27px;line-height:1.35}
body.v .logo{font-size:150px} body.v .tag{font-size:34px;max-width:900px;line-height:1.4} body.v .pill{font-size:34px;padding:22px 30px} body.v .small{font-size:26px}
</style></head><body>
<div id="bg"></div>
<div id="win"><div id="bar"><i style="background:#ed8796"></i><i style="background:#eed49f"></i><i style="background:#a6da95"></i><span>tasq</span></div>
  <div id="view"><div id="cam"></div></div></div>
<div id="capbox"><div id="cap"></div><div id="sub"></div></div>
<div class="card" id="intro"><div class="logo"><span class="sq"></span><span id="word"></span><span class="cursor" id="cur"></span></div>
  <div class="tag" id="tag">Your tasks, in the terminal.</div></div>
<div class="card" id="outro"><div class="logo"><span class="sq"></span>tasq</div>
  <div class="tag">Capture · plan · sync. Free and open source.</div>
  <div class="pill"><em>$</em> brew install tasq-app/tap/tasq</div>
  <div class="small">tasq-app.github.io/tasq</div></div>
<script>
const SCENES = __SCENES__;
const V = __VERTICAL__;
document.body.className = V ? 'v' : 'h';
const S = Object.fromEntries(SCENES.map(s => [s.name, s]));
// The cut. Camera keys: [ms into the clip, zoom, centre x, centre y] in the
// take's own pixels (1200×748); `cam` for landscape (zoom 1 = the whole
// take), `vcam` for portrait (zoom 1 = the take's full width).
const CUT = [
  {name:'capture', from:0, len:7200, cap:'Type it like you <b>say it.</b>', sub:'Dates, times, durations, spaces — picked out as you type',
   cam:[[0,1,600,374],[800,1,600,374],[1800,1.3,575,345],[5600,1.3,575,345],[6400,1.05,600,374]],
   vcam:[[0,1.2,600,374],[700,1.2,600,374],[1600,1.7,455,345],[5600,1.7,455,345],[6400,1.35,540,360]]},
  {name:'today', from:0, len:3000, cap:'Your day, <b>at a glance.</b>', sub:'Today, the day in order, and the gaps between',
   cam:[[0,1.05,600,374],[400,1.05,600,374],[1500,2.0,1030,560],[3000,2.05,1030,560]],
   vcam:[[0,1.3,560,374],[400,1.3,560,374],[1500,3.3,1030,575],[3000,3.4,1030,575]]},
  {name:'spanish', from:0, len:4900, cap:'…y también <b>en español.</b>', sub:'“mañana a las 6 cada lunes” — understood',
   cam:[[0,1.3,575,345],[4900,1.34,575,345]],
   vcam:[[0,1.7,455,345],[4900,1.75,455,345]]},
  {name:'week', from:0, len:3000, cap:'Plan the <b>week.</b>', sub:'Time blocks, drag to move, the agenda a key away',
   cam:[[0,1.05,600,374],[3000,1.25,700,330]],
   vcam:[[0,1.45,560,340],[3000,1.6,600,330]]},
  {name:'month', from:1300, len:2900, cap:'See the <b>month.</b>', sub:'Scroll it a week at a time',
   cam:[[0,1.2,700,374],[2900,1.05,640,374]],
   vcam:[[0,1.6,700,374],[2900,1.45,680,374]]},
  {name:'calendars', from:0, len:3200, cap:'On all your <b>computers</b>, in your <b>calendars.</b>', sub:'End-to-end encrypted sync · Google & Apple Calendar',
   cam:[[0,1.05,600,374],[600,1.05,600,374],[1600,1.58,705,225],[3200,1.62,705,225]],
   vcam:[[0,1.3,620,300],[600,1.3,620,300],[1600,2.0,640,230],[3200,2.05,640,230]]},
  {name:'themes', from:600, len:3900, cap:'Make it <b>yours.</b>', sub:'Themes, layouts, your keys',
   cam:[[0,1.05,600,374],[3900,1.05,600,374]],
   vcam:[[0,1.5,560,374],[3900,1.55,560,374]]},
];
const INTRO = 3000, OUTRO = 5000, FADE = 350;
let t0 = INTRO; for (const c of CUT) { c.start = t0; t0 += c.len; }
const TOTAL = t0 + OUTRO;
window.TOTAL = TOTAL;

const view = document.getElementById('view');
const VW = view.clientWidth, VH = view.clientHeight;
// Zoom 1: landscape fits the take to the view; portrait fits its width.
const BASE = VW / 1200;
// Where the camera's point sits in the view: a little high in landscape,
// clear of the caption over the bottom.
const AIM = V ? 0.5 : 0.42;

const cam = document.getElementById('cam');
const imgs = {};
for (const s of SCENES) for (const [, h] of s.frames) if (!imgs[h]) {
  const im = new Image(); im.src = 'frames/' + h + '.png'; cam.appendChild(im); imgs[h] = im;
}
const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
function frameAt(scene, ms) {
  let h = scene.frames[0][1];
  for (const [ft, fh] of scene.frames) if (ft <= ms) h = fh;
  return h;
}
function camAt(keys, ms) {
  if (ms <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) {
    const [a, b] = [keys[i-1], keys[i]];
    if (ms <= b[0]) {
      const k = ease((ms - a[0]) / (b[0] - a[0]));
      return [1,2,3].map(j => a[j] + (b[j] - a[j]) * k);
    }
  }
  return keys[keys.length-1].slice(1);
}
const keysOf = c => V ? c.vcam : c.cam;
const $ = id => document.getElementById(id);
window.render = function (t) {
  const iv = t < INTRO ? 1 : clamp(1 - (t - INTRO) / 500);
  $('intro').style.opacity = iv;
  $('word').textContent = 'tasq'.slice(0, Math.floor(clamp((t - 300) / 600) * 4));
  $('cur').style.opacity = (Math.floor(t / 400) % 2 === 0 || t < 1000) ? 1 : 0;
  const tg = clamp((t - 1200) / 600);
  $('tag').style.opacity = tg; $('tag').style.transform = `translateY(${(1-ease(tg))*20}px)`;

  const end = TOTAL - OUTRO;
  const wIn = ease(clamp((t - INTRO + 300) / 700)), wOut = ease(clamp((t - end) / 500));
  const win = $('win');
  win.style.opacity = wIn * (1 - wOut);
  win.style.transform = `translateY(${(1-wIn)*120 + wOut*-40}px) scale(${0.96 + 0.04*wIn - 0.03*wOut})`;

  const c = CUT.find(c => t >= c.start && t < c.start + c.len) || (t < INTRO ? CUT[0] : CUT[CUT.length-1]);
  const local = clamp(t - c.start, 0, c.len);
  const show = frameAt(S[c.name], c.from + local);
  const idx = CUT.indexOf(c), prev = CUT[idx-1];
  const fadeIn = prev ? clamp(local / FADE) : 1;
  for (const im of Object.values(imgs)) im.style.opacity = 0;
  imgs[show].style.opacity = 1;
  if (prev && fadeIn < 1) {
    const ph = frameAt(S[prev.name], prev.from + prev.len);
    if (ph !== show) { imgs[ph].style.opacity = 1 - fadeIn; imgs[show].style.opacity = fadeIn; }
  }
  let [z, cx, cy] = camAt(keysOf(c), local);
  if (prev && fadeIn < 1) {
    const [pz, px, py] = camAt(keysOf(prev), prev.len);
    const k = ease(fadeIn); z = pz + (z-pz)*k; cx = px + (cx-px)*k; cy = py + (cy-py)*k;
  }
  const s = BASE * z;
  let x = VW / 2 - cx * s, y = VH * AIM - cy * s;
  // Never past the take's edges; a take shorter than the view sits centred.
  x = Math.min(0, Math.max(VW - 1200 * s, x));
  y = 748 * s <= VH ? (VH - 748 * s) / 2 : Math.min(0, Math.max(VH - 748 * s, y));
  cam.style.transform = `translate(${x}px,${y}px) scale(${s})`;

  const capIn = ease(clamp((local - 150) / 450)), capOut = ease(clamp((local - (c.len - 350)) / 300));
  const on = t >= INTRO - 200 && t < end;
  const box = $('capbox');
  if (box.dataset.n !== c.name) { $('cap').innerHTML = c.cap; $('sub').textContent = c.sub; box.dataset.n = c.name; }
  const cv = on ? capIn * (1 - capOut) : 0;
  box.style.opacity = cv;
  const lift = (1-capIn)*24 - capOut*12;
  box.style.transform = (V ? '' : 'translateX(-50%) ') + `translateY(${lift}px)`;

  const ov = ease(clamp((t - end - 250) / 600));
  $('outro').style.opacity = ov;
  $('outro').style.transform = `scale(${0.97 + 0.03*ov})`;
};
render(0);
</script></body></html>

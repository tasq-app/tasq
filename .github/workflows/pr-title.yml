name: PR title

# PRs are squash-merged and the PR title becomes the commit on main, which
# release-please reads to pick the next version and write the changelog.
# So the title must be a conventional commit: `feat: …`, `fix(notes): …`.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

# Reads the title only; never checks out PR code.
permissions:
  pull-requests: read

jobs:
  check:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false

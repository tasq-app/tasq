name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checkout is all this workflow needs; never grant write from a PR run.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          cache: true
          # mise 2026.11.4 can't be downloaded (every attempt fails with an
          # HTTP error, from GitHub and from mise.jdx.dev): pin the one before.
          version: 2026.11.3

      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: mise run fmt_check

      - name: cargo clippy
        run: mise run clippy

      - name: cargo test
        run: mise run test

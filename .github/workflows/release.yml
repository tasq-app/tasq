name: Release

# How releases happen (see CONTRIBUTING.md):
#   1. Every push to main runs release-please, which keeps a "release PR"
#      open with the next version (from the conventional commits since the
#      last release) and its CHANGELOG entry.
#   2. Merging that PR makes release-please tag the version and create the
#      GitHub release; the jobs below then build the binaries, attach them
#      and update the Homebrew formula.
# `workflow_dispatch` with a tag rebuilds and re-attaches an existing
# release's binaries (e.g. after a failed build).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild (e.g. v0.1.0-alpha.1)"
        required: true

# Default for every job: read-only. Jobs that need more raise it themselves.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          # A token of the maintainer's, not GITHUB_TOKEN: the repository
          # doesn't let Actions open pull requests, and a release PR opened
          # with GITHUB_TOKEN wouldn't run CI either.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build ${{ matrix.target }}
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            linker: aarch64-linux-gnu-gcc
            apt_packages: gcc-aarch64-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compilation toolchain
        if: matrix.apt_packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Configure cross linker
        if: matrix.linker
        run: |
          target_upper=$(echo "${{ matrix.target }}" | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${target_upper}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          stage="tasq-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${stage}"
          cp "target/${{ matrix.target }}/release/tasq" "dist/${stage}/"
          cp README.md "dist/${stage}/" 2>/dev/null || true
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          shasum -a 256 "dist/${stage}.tar.gz" > "dist/${stage}.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "tasq-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/tasq.exe" "dist/$stage/"
          if (Test-Path README.md) { Copy-Item README.md "dist/$stage/" }
          Compress-Archive -Path "dist/$stage/*" -DestinationPath "dist/$stage.zip"
          (Get-FileHash "dist/$stage.zip" -Algorithm SHA256).Hash | Out-File -Encoding ascii "dist/$stage.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tasq-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Attach binaries
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # The only job that writes to this repo: it uploads the binaries to the
    # release release-please created.
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Upload to the release
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  update-tap:
    name: Update Homebrew tap
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    # Touches only tasq-app/homebrew-tap, authenticated with HOMEBREW_TAP_TOKEN.
    # GITHUB_TOKEN needs no scopes at all here.
    permissions: {}
    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tasq-app/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render formula
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          fetch_sha() {
            curl -fsSL \
              "https://github.com/tasq-app/tasq/releases/download/${TAG}/tasq-${TAG}-$1.tar.gz.sha256" \
              | awk '{print $1}'
          }
          sha_darwin_arm=$(fetch_sha aarch64-apple-darwin)
          sha_darwin_intel=$(fetch_sha x86_64-apple-darwin)
          sha_linux_arm=$(fetch_sha aarch64-unknown-linux-gnu)
          sha_linux_intel=$(fetch_sha x86_64-unknown-linux-gnu)

          # The first release creates the folder.
          mkdir -p tap/Formula
          cat > tap/Formula/tasq.rb <<EOF
          class Tasq < Formula
            desc "Capture your notes, plan your routines from the terminal"
            homepage "https://github.com/tasq-app/tasq"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/tasq-app/tasq/releases/download/v#{version}/tasq-v#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${sha_darwin_arm}"
              end
              on_intel do
                url "https://github.com/tasq-app/tasq/releases/download/v#{version}/tasq-v#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "${sha_darwin_intel}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/tasq-app/tasq/releases/download/v#{version}/tasq-v#{version}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${sha_linux_arm}"
              end
              on_intel do
                url "https://github.com/tasq-app/tasq/releases/download/v#{version}/tasq-v#{version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${sha_linux_intel}"
              end
            end

            def install
              bin.install "tasq"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/tasq --version")
            end
          end
          EOF

      - name: Commit and push
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          cd tap
          git config user.name  "tasq-release-bot"
          git config user.email "actions@users.noreply.github.com"
          # Staged first, so a brand-new formula counts as a change too.
          git add Formula/tasq.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date; nothing to commit."
            exit 0
          fi
          git commit -m "tasq ${TAG}"
          git push

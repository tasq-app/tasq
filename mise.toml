#:schema https://mise.jdx.dev/schema/mise.json

[settings]
lockfile = true

[tools]
rust = "latest"
lefthook = "latest"

[tasks.clippy]
run = "cargo clippy --all-targets --locked -- -D warnings"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.fmt_check]
run = { task = "fmt", args = ["--check"] }

[tasks.tasq]
run = "cargo run --bin tasq --"
description = "Run the in-development tasq executable. `mise run tasq -- <args>` for CLI commands"

[tasks.preflight]
description = "Prepare and verify changes ready for PR submission"
run = [ # Run fmt serially first so other tasks won't see files mid-write
    { task = "fmt" },
    { tasks = ["clippy", "test"] },
]

[tasks.test]
run = "cargo test --locked"

[tasks.test_update_snapshots]
run = "INSTA_UPDATE=always cargo test --test snapshots --locked"

[tasks.screenshots]
run = "cargo run --example screenshots"

[tasks.videos]
description = "Record the showcase GIFs in docs/videos via vhs (requires vhs on PATH, JetBrains Mono and a Nerd Font symbols font)."
run = [
    "cargo build --release",
    "for t in docs/videos/*.tape; do vhs \"$t\"; done",
]
